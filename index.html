<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farmácia - Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <section class="brand-panel" aria-label="Sobre a Farmácia">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true">
          <span class="cross vertical"></span>
          <span class="cross horizontal"></span>
        </div>
        <span>FarmaVida</span>
      </div>

      <div class="brand-content">
        <p class="eyebrow">CUIDADO AO SEU LADO</p>
        <h1>Saúde e bem-estar<br>para toda família.</h1>
        <p class="brand-description">Encontre os melhores produtos e cuidamos de você com atenção em cada etapa.</p>
      </div>

      <div class="decoration decoration-one"></div>
      <div class="decoration decoration-two"></div>
    </section>

    <section class="form-panel">
      <form class="login-card">
        <h2>Bem-vindo de volta</h2>
        <p class="subtitle">Faça login para acessar sua conta</p>

        <div class="field">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="field">
          <label for="password">Senha</label>
          <input type="password" id="password" name="password" placeholder="Digite sua senha" autocomplete="current-password" required>
        </div>

        <div class="form-options">
          <label class="remember">
            <input type="checkbox" name="remember">
            <span>Lembrar-me</span>
          </label>
          <a href="#">Esqueceu a senha?</a>
        </div>

        <button type="submit">Entrar</button>

        <p class="register">Ainda não tem conta? <a href="#">Cadastre-se</a></p>
      </form>
    </section>
  </main>
</body>
</html>
